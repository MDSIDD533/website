<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0a0a0f;
    }
    #stage3d-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <div data-hf-id="hf-mod0" id="root" data-composition-id="stage3d" data-width="1920" data-height="1080">
    <canvas data-hf-id="hf-7cs5" id="stage3d-canvas" class="clip" data-start="0" data-duration="60" data-track-index="0"></canvas>
  </div>
  <script src="assets/lib/three.min.js"></script>
  <script>
    (function () {
      const GOLD = 0xd4af37;
      const BLUE = 0x4a90d9;
      const LIGHT_BLUE = 0x8fc1f2;
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const seg = (t, a, b) => clamp01((t - a) / (b - a));
      const smooth = (v) => {
        v = clamp01(v);
        return v * v * (3 - 2 * v);
      };
      const easeOut = (v) => 1 - Math.pow(1 - clamp01(v), 3);
      const lerp = (a, b, v) => a + (b - a) * v;
      const hash = (i) => {
        const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      const canvas = document.getElementById("stage3d-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.setClearColor(0x0a0a0f, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0a0a0f, 0.028);
      const camera = new THREE.PerspectiveCamera(42, 1920 / 1080, 0.1, 100);

      scene.add(new THREE.AmbientLight(0x33415e, 1.7));
      const key = new THREE.DirectionalLight(0xffe2a8, 2.6);
      key.position.set(-5, 6, 7);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x6fb1ff, 1.9);
      rim.position.set(6, 2, -5);
      scene.add(rim);
      const coinLight = new THREE.PointLight(GOLD, 6, 9, 1.8);
      scene.add(coinLight);

      const grid = new THREE.GridHelper(24, 48, 0x16283f, 0x0d1622);
      grid.position.y = -2.58;
      grid.material.transparent = true;
      grid.material.opacity = 0.16;
      scene.add(grid);

      // Deterministic canvas environment so metals read as metal (no external HDR).
      {
        const ec = document.createElement("canvas");
        ec.width = 1024; ec.height = 512;
        const ex = ec.getContext("2d");
        const lg = ex.createLinearGradient(0, 0, 0, 512);
        lg.addColorStop(0, "#2a3648"); lg.addColorStop(0.45, "#0d1420"); lg.addColorStop(1, "#05070c");
        ex.fillStyle = lg; ex.fillRect(0, 0, 1024, 512);
        let rg = ex.createRadialGradient(300, 170, 10, 300, 170, 280);
        rg.addColorStop(0, "rgba(255,230,170,0.95)"); rg.addColorStop(1, "rgba(255,230,170,0)");
        ex.fillStyle = rg; ex.fillRect(0, 0, 1024, 512);
        rg = ex.createRadialGradient(770, 205, 10, 770, 205, 320);
        rg.addColorStop(0, "rgba(120,180,255,0.5)"); rg.addColorStop(1, "rgba(120,180,255,0)");
        ex.fillStyle = rg; ex.fillRect(0, 0, 1024, 512);
        const etex = new THREE.CanvasTexture(ec);
        etex.mapping = THREE.EquirectangularReflectionMapping;
        etex.colorSpace = THREE.SRGBColorSpace;
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromEquirectangular(etex).texture;
        etex.dispose(); pmrem.dispose();
      }

      // Deterministic faint star/data field.
      {
        const n = 620;
        const pos = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          const r = 11 + hash(i + 9) * 9;
          const th = hash(i + 31) * Math.PI * 2;
          const ph = Math.acos(2 * hash(i + 77) - 1);
          pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
          pos[i * 3 + 1] = (r * Math.cos(ph)) * 0.55;
          pos[i * 3 + 2] = -Math.abs(r * Math.sin(ph) * Math.sin(th)) - 3;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x54749c, size: 0.035, transparent: true, opacity: 0.62 })));
      }

      function makeRadialSprite(inner, outer, scale) {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        const grad = ctx.createRadialGradient(128, 128, 4, 128, 128, 128);
        grad.addColorStop(0, inner);
        grad.addColorStop(0.36, outer);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 256);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.72 }));
        sp.scale.set(scale, scale, 1);
        return sp;
      }

      function makeTextSprite(text, color, scaleX, scaleY, weight) {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 192;
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, 512, 192);
        ctx.font = `${weight || 800} 82px Inter, Arial, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0,0,0,0.75)";
        ctx.shadowBlur = 10;
        ctx.fillStyle = color;
        ctx.fillText(text, 256, 100);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 4;
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
        sp.scale.set(scaleX, scaleY, 1);
        return sp;
      }

      function makeCoinTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 768;
        const ctx = c.getContext("2d");
        const grad = ctx.createRadialGradient(300, 250, 40, 384, 384, 390);
        grad.addColorStop(0, "#ffe9a8");
        grad.addColorStop(0.48, "#d4af37");
        grad.addColorStop(0.82, "#9a741c");
        grad.addColorStop(1, "#6f4f0d");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 768, 768);
        ctx.strokeStyle = "rgba(255,240,180,0.9)";
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.arc(384, 384, 330, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "rgba(105,72,8,0.85)";
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(384, 384, 296, 0, Math.PI * 2); ctx.stroke();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "900 470px Inter, Arial, sans-serif";
        ctx.fillStyle = "rgba(255,246,190,0.88)";
        ctx.fillText("$", 392, 396);
        ctx.fillStyle = "#6d4d09";
        ctx.fillText("$", 384, 384);
        ctx.font = "800 44px Inter, Arial, sans-serif";
        ctx.fillStyle = "rgba(84,57,6,0.9)";
        ctx.fillText("USD", 384, 642);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        return tex;
      }

      // Gold dollar coin (hero object).
      const coinGroup = new THREE.Group();
      {
        const coinTex = makeCoinTexture();
        coinTex.center.set(0.5, 0.5);
        coinTex.rotation = Math.PI / 2;
        const backTex = coinTex.clone();
        backTex.center.set(0.5, 0.5);
        backTex.rotation = Math.PI / 2;
        backTex.needsUpdate = true;
        const sideMat = new THREE.MeshStandardMaterial({ color: 0xa87f1f, metalness: 0.88, roughness: 0.34 });
        const capMat = new THREE.MeshStandardMaterial({ map: coinTex, metalness: 0.55, roughness: 0.38 });
        const backMat = new THREE.MeshStandardMaterial({ map: backTex, metalness: 0.55, roughness: 0.38 });
        const coin = new THREE.Mesh(new THREE.CylinderGeometry(1.28, 1.28, 0.22, 96, 1, false), [sideMat, capMat, backMat]);
        coin.rotation.x = Math.PI / 2;
        coinGroup.add(coin);
        const ridgeGeo = new THREE.BoxGeometry(0.055, 0.15, 0.24);
        const ridgeMat = new THREE.MeshStandardMaterial({ color: 0xc79a28, metalness: 0.85, roughness: 0.38 });
        for (let i = 0; i < 72; i++) {
          const a = (i / 72) * Math.PI * 2;
          const ridge = new THREE.Mesh(ridgeGeo, ridgeMat);
          ridge.position.set(Math.cos(a) * 1.31, Math.sin(a) * 1.31, 0);
          ridge.rotation.z = a + Math.PI / 2;
          coinGroup.add(ridge);
        }
        const glow = makeRadialSprite("rgba(255,214,96,0.55)", "rgba(212,175,55,0.18)", 5.6);
        glow.name = "coinGlow";
        glow.position.z = -0.35;
        coinGroup.add(glow);
      }
      scene.add(coinGroup);

      // Globe + routes.
      const globeGroup = new THREE.Group();
      const routes = [];
      {
        const R = 2.05;
        const inner = new THREE.Mesh(
          new THREE.SphereGeometry(R * 0.985, 48, 32),
          new THREE.MeshStandardMaterial({ color: 0x071827, roughness: 0.58, metalness: 0.08 })
        );
        globeGroup.add(inner);
        const wire = new THREE.Mesh(
          new THREE.SphereGeometry(R, 36, 24),
          new THREE.MeshBasicMaterial({ color: 0x2e6ea8, wireframe: true, transparent: true, opacity: 0.30 })
        );
        globeGroup.add(wire);
        const n = 850;
        const pos = new Float32Array(n * 3);
        const golden = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < n; i++) {
          const y = 1 - (i / (n - 1)) * 2;
          const rad = Math.sqrt(Math.max(0, 1 - y * y));
          const th = golden * i;
          pos[i * 3] = Math.cos(th) * rad * R * 1.012;
          pos[i * 3 + 1] = y * R * 1.012;
          pos[i * 3 + 2] = Math.sin(th) * rad * R * 1.012;
        }
        const pg = new THREE.BufferGeometry();
        pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        globeGroup.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: LIGHT_BLUE, size: 0.05, transparent: true, opacity: 0.8 })));

        const latLon = (lat, lon) => {
          const phi = (90 - lat) * Math.PI / 180;
          const theta = (lon + 180) * Math.PI / 180;
          return new THREE.Vector3(
            -R * Math.sin(phi) * Math.cos(theta),
            R * Math.cos(phi),
            R * Math.sin(phi) * Math.sin(theta)
          );
        };
        const cities = {
          nyc: latLon(40.7, -74), lon: latLon(51.5, 0), fra: latLon(50.1, 8.7),
          dxb: latLon(25.2, 55.3), bom: latLon(19.1, 72.9), sin: latLon(1.35, 103.8),
          tyo: latLon(35.7, 139.7), syd: latLon(-33.9, 151.2), gru: latLon(-23.5, -46.6)
        };
        Object.values(cities).forEach((p) => {
          const m = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), new THREE.MeshBasicMaterial({ color: GOLD }));
          m.position.copy(p.clone().multiplyScalar(1.02));
          globeGroup.add(m);
        });
        const pairs = [["nyc","lon"],["nyc","fra"],["nyc","tyo"],["lon","dxb"],["fra","bom"],["dxb","sin"],["sin","tyo"],["sin","syd"],["nyc","gru"],["lon","sin"]];
        pairs.forEach(([a, b], idx) => {
          const start = cities[a], end = cities[b];
          const dist = start.distanceTo(end);
          const mid = start.clone().add(end).multiplyScalar(0.5).normalize().multiplyScalar(R + 0.18 + dist * 0.16);
          const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
          const geo = new THREE.TubeGeometry(curve, 72, idx % 3 === 0 ? 0.016 : 0.011, 6, false);
          const mat = new THREE.MeshBasicMaterial({ color: idx % 3 === 0 ? GOLD : BLUE, transparent: true, opacity: 0.78 });
          const tube = new THREE.Mesh(geo, mat);
          globeGroup.add(tube);
          routes.push({ curve, geo, full: geo.index ? geo.index.count : geo.attributes.position.count, phase: hash(idx + 4) });
        });
        const pulseGeo = new THREE.SphereGeometry(0.055, 12, 12);
        routes.forEach((r, idx) => {
          r.pulses = [];
          for (let k = 0; k < 2; k++) {
            const p = new THREE.Mesh(pulseGeo, new THREE.MeshBasicMaterial({ color: idx % 3 === 0 ? 0xffe08a : 0xbfe0ff }));
            globeGroup.add(p);
            r.pulses.push(p);
          }
        });
      }
      scene.add(globeGroup);

      // Commodity objects for Unit of Account.
      const commodityGroup = new THREE.Group();
      {
        const barrel = new THREE.Group();
        const barrelBody = new THREE.Mesh(
          new THREE.CylinderGeometry(0.34, 0.34, 0.92, 28),
          new THREE.MeshStandardMaterial({ color: 0x274b78, metalness: 0.35, roughness: 0.45 })
        );
        barrel.add(barrelBody);
        [-0.28, 0, 0.28].forEach((y) => {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.345, 0.028, 10, 40), new THREE.MeshStandardMaterial({ color: LIGHT_BLUE, metalness: 0.4, roughness: 0.35 }));
          ring.rotation.x = Math.PI / 2;
          ring.position.y = y;
          barrel.add(ring);
        });
        barrel.position.set(-2.45, -1.7, 0.35);
        commodityGroup.add(barrel);

        const goldBar = new THREE.Group();
        const gm = new THREE.MeshStandardMaterial({ color: GOLD, metalness: 0.6, roughness: 0.35, emissive: 0x1a1002 });
        const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.28, 0.5), gm);
        const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.16, 0.36), gm);
        b2.position.y = 0.22;
        goldBar.add(b1, b2);
        goldBar.position.set(0, -1.88, 0.35);
        commodityGroup.add(goldBar);

        const coil = new THREE.Mesh(
          new THREE.TorusGeometry(0.38, 0.13, 18, 48),
          new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.82, roughness: 0.34 })
        );
        coil.position.set(2.45, -1.58, 0.35);
        commodityGroup.add(coil);
        commodityGroup.userData.coil = coil;
        commodityGroup.userData.barrel = barrel;
        commodityGroup.userData.goldBar = goldBar;
      }
      scene.add(commodityGroup);

      // 3D reserve bars.
      const chartGroup = new THREE.Group();
      const chartBars = [];
      {
        const base = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.12, 1.25), new THREE.MeshStandardMaterial({ color: 0x182438, metalness: 0.35, roughness: 0.5 }));
        base.position.set(0, -0.06, 0);
        chartGroup.add(base);
        const data = [
          { v: 57, color: GOLD, label: "USD 57%" },
          { v: 20, color: BLUE, label: "EUR 20%" },
          { v: 23, color: 0x8b98a8, label: "OTHER 23%" }
        ];
        data.forEach((d, i) => {
          const geo = new THREE.BoxGeometry(0.82, 1, 0.82);
          geo.translate(0, 0.5, 0);
          const bar = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: d.color, metalness: 0.55, roughness: 0.32 }));
          bar.position.set((i - 1) * 1.45, 0, 0);
          chartGroup.add(bar);
          const lab = makeTextSprite(d.label, i === 0 ? "#ffe08a" : "#dbeafe", 1.7, 0.42, 900);
          lab.position.set((i - 1) * 1.45, 0.4, 0.62);
          chartGroup.add(lab);
          chartBars.push({ bar, lab, h: (d.v / 57) * 3.15, i });
        });
        chartGroup.position.set(1.75, -1.82, 0.1);
      }
      scene.add(chartGroup);

      // Network nodes around the coin hub.
      const networkGroup = new THREE.Group();
      const networkEdges = [];
      {
        const labels = ["EUR", "JPY", "GBP", "CNY", "CHF", "AED", "INR", "BRL"];
        const nodeGeo = new THREE.SphereGeometry(0.13, 20, 20);
        labels.forEach((label, i) => {
          const a = (i / labels.length) * Math.PI * 2 + 0.18;
          const p = new THREE.Vector3(Math.cos(a) * 3.35, Math.sin(a) * 1.72 + 0.08, Math.sin(a * 2.0) * 0.55);
          const node = new THREE.Mesh(nodeGeo, new THREE.MeshStandardMaterial({ color: BLUE, emissive: 0x123a63, metalness: 0.25, roughness: 0.3 }));
          node.position.copy(p);
          networkGroup.add(node);
          const lab = makeTextSprite(label, "#dbeafe", 0.86, 0.32, 800);
          lab.position.copy(p.clone().add(new THREE.Vector3(0, 0.34, 0.1)));
          networkGroup.add(lab);
          const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.08, 0), p]);
          const line = new THREE.Line(lg, new THREE.LineBasicMaterial({ color: BLUE, transparent: true, opacity: 0.58 }));
          networkGroup.add(line);
          const pulse = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
          networkGroup.add(pulse);
          networkEdges.push({ p, pulse, phase: i / labels.length, node });
        });
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(2.45, 0.018, 10, 140, Math.PI * 1.72),
          new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: 0.72 })
        );
        ring.position.z = -0.35;
        ring.name = "cycleRing";
        networkGroup.add(ring);
        const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.3, 18), new THREE.MeshBasicMaterial({ color: GOLD }));
        arrow.name = "cycleArrow";
        networkGroup.add(arrow);
      }
      networkGroup.position.y = -0.18;
      scene.add(networkGroup);

      // Foundation columns.
      const foundationGroup = new THREE.Group();
      const columns = [];
      {
        const stone = new THREE.MeshStandardMaterial({ color: 0x33445c, metalness: 0.28, roughness: 0.48 });
        const trim = new THREE.MeshStandardMaterial({ color: GOLD, metalness: 0.75, roughness: 0.32 });
        [-2.05, 0, 2.05].forEach((x) => {
          const geo = new THREE.CylinderGeometry(0.38, 0.47, 1, 24);
          geo.translate(0, 0.5, 0);
          const col = new THREE.Mesh(geo, stone);
          col.position.set(x, -2.55, 0);
          foundationGroup.add(col);
          columns.push(col);
          const cap = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.16, 0.8), trim);
          cap.position.set(x, -2.55, 0);
          cap.name = "cap";
          foundationGroup.add(cap);
          columns.push(cap);
        });
        const platform = new THREE.Mesh(new THREE.BoxGeometry(5.9, 0.24, 1.05), stone);
        platform.position.set(0, -0.72, 0);
        platform.name = "platform";
        foundationGroup.add(platform);
        const edge = new THREE.Mesh(new THREE.BoxGeometry(5.95, 0.055, 1.1), trim);
        edge.position.set(0, -0.58, 0);
        edge.name = "platformEdge";
        foundationGroup.add(edge);
      }
      scene.add(foundationGroup);

      const camKeys = [
        [0, new THREE.Vector3(0, 0.25, 8.6), new THREE.Vector3(0, 0.1, 0)],
        [5, new THREE.Vector3(0, 0.15, 9.0), new THREE.Vector3(0, 0, 0)],
        [11, new THREE.Vector3(-0.35, 0.3, 8.4), new THREE.Vector3(-0.8, 0, 0)],
        [20, new THREE.Vector3(0.35, 0.25, 8.4), new THREE.Vector3(0.8, 0, 0)],
        [29, new THREE.Vector3(3.8, 2.35, 7.1), new THREE.Vector3(1.15, -0.55, 0)],
        [40, new THREE.Vector3(0, 0.35, 8.7), new THREE.Vector3(0, 0.05, 0)],
        [49, new THREE.Vector3(0, 0.45, 8.2), new THREE.Vector3(0, -0.25, 0)],
        [55, new THREE.Vector3(0, 0.32, 7.8), new THREE.Vector3(0, 0.2, 0)],
        [60, new THREE.Vector3(0, 0.32, 7.8), new THREE.Vector3(0, 0.2, 0)]
      ];
      function setCamera(t) {
        let a = camKeys[0], b = camKeys[camKeys.length - 1];
        for (let i = 0; i < camKeys.length - 1; i++) {
          if (t >= camKeys[i][0] && t <= camKeys[i + 1][0]) { a = camKeys[i]; b = camKeys[i + 1]; break; }
        }
        const v = smooth(seg(t, a[0], b[0]));
        camera.position.lerpVectors(a[1], b[1], v);
        const look = new THREE.Vector3().lerpVectors(a[2], b[2], v);
        camera.lookAt(look);
      }

      function setGroupScale(group, p) {
        const s = Math.max(0.0001, p);
        group.scale.set(s, s, s);
        group.visible = p > 0.01;
      }

      function renderAt(rawT) {
        const t = Math.max(0, Math.min(60, Number(rawT) || 0));
        setCamera(t);

        // Coin path and rotation. The outro uses a decaying extra turn so it settles facing camera.
        let coinPos, coinScale;
        if (t < 5) {
          const p = easeOut(seg(t, 1.05, 2.1));
          coinPos = new THREE.Vector3(2.55, 0.22, 0);
          coinScale = 0.18 + 0.9 * p;
        } else if (t < 40) {
          const p = smooth(seg(t, 5, 6.2));
          const wide = smooth(seg(t, 19.8, 21.0)) * (1 - smooth(seg(t, 28.6, 29.8)));
          const bx = lerp(3.72, 4.5, wide), by = lerp(1.78, 2.05, wide), bz = lerp(-1.15, -1.3, wide);
          coinPos = new THREE.Vector3(lerp(2.55, bx, p), lerp(0.22, by, p), lerp(0, bz, p));
          const unitHide = 1 - smooth(seg(t, 10.4, 11.2)) * (1 - smooth(seg(t, 19.8, 20.6)));
          coinScale = lerp(1.08, 0.4, p) * Math.max(0.0001, unitHide);
        } else if (t < 49) {
          const p = smooth(seg(t, 40, 41.2));
          coinPos = new THREE.Vector3(lerp(3.72, 0, p), lerp(1.78, 0.08, p), lerp(-1.15, 0, p));
          coinScale = lerp(0.4, 0.64, p);
        } else if (t < 55) {
          const p = easeOut(seg(t, 49, 51.4));
          coinPos = new THREE.Vector3(0, lerp(1.65, 0.48, p), 0);
          coinScale = lerp(0.64, 0.82, p);
        } else {
          const p = easeOut(seg(t, 55, 56.8));
          coinPos = new THREE.Vector3(0, lerp(0.48, 0.72, p), 0);
          coinScale = lerp(0.82, 1.08, p);
        }
        coinGroup.position.copy(coinPos);
        coinGroup.scale.set(coinScale, coinScale, coinScale);
        let rot = t * 0.9;
        if (t >= 55) rot = 49.5 + 0.76548 * (1 - Math.exp(-(t - 55) * 1.25));
        coinGroup.rotation.set(-0.08 + Math.sin(t * 0.7) * 0.035, rot, 0.035 * Math.sin(t * 0.5));
        coinGroup.visible = t >= 1.02 && coinScale > 0.02;
        coinLight.position.copy(coinPos.clone().add(new THREE.Vector3(0.6, 0.9, 1.8)));
        const glow = coinGroup.getObjectByName("coinGlow");
        if (glow) glow.material.opacity = 0.48 + 0.2 * seg(t, 55, 58);

        // Globe appears for the first two pillars and crosses sides between them.
        const globeIn = easeOut(seg(t, 10.55, 11.7));
        const globeOut = 1 - seg(t, 28.45, 29.35);
        const globeP = Math.min(globeIn, globeOut);
        const cross = smooth(seg(t, 19.45, 20.9));
        globeGroup.position.set(lerp(-2.32, 2.32, cross), 0.5, -0.15);
        globeGroup.rotation.y = -0.55 + t * 0.16;
        globeGroup.rotation.x = 0.12;
        setGroupScale(globeGroup, 0.82 * globeP + 0.0001);
        const routeBase = t < 20 ? seg(t, 12.2, 14.8) : 1;
        routes.forEach((r, idx) => {
          const rp = clamp01(routeBase * 1.25 - idx * 0.035);
          r.geo.setDrawRange(0, Math.floor(rp * r.full));
          r.pulses.forEach((pulse, k) => {
            const speed = t < 20 ? 0.075 : 0.16;
            const u = (t * speed + r.phase + k * 0.5) % 1;
            pulse.position.copy(r.curve.getPointAt(u));
            pulse.visible = globeP > 0.05 && rp > 0.15;
            const s = 0.75 + 0.45 * Math.sin((u + k) * Math.PI);
            pulse.scale.set(s, s, s);
          });
        });

        const comP = Math.min(easeOut(seg(t, 12.1, 13.0)), 1 - seg(t, 19.35, 20.05));
        commodityGroup.position.y = -0.35 * (1 - comP);
        setGroupScale(commodityGroup, comP);
        if (commodityGroup.userData.coil) commodityGroup.userData.coil.rotation.y = t * 0.55;
        if (commodityGroup.userData.barrel) commodityGroup.userData.barrel.rotation.y = -t * 0.28;
        if (commodityGroup.userData.goldBar) commodityGroup.userData.goldBar.rotation.y = 0.45 + Math.sin(t * 0.6) * 0.12;

        const chartP = Math.min(easeOut(seg(t, 28.7, 29.8)), 1 - seg(t, 39.35, 40.15));
        setGroupScale(chartGroup, chartP);
        chartGroup.rotation.y = -0.34 + 0.22 * smooth(seg(t, 29.5, 38.5));
        chartBars.forEach(({ bar, lab, h, i }) => {
          const p = easeOut(seg(t, 30.15 + i * 0.55, 31.75 + i * 0.55));
          bar.scale.y = Math.max(0.001, h * p);
          lab.position.y = h * p + 0.34;
          lab.material.opacity = p;
        });

        const netP = Math.min(easeOut(seg(t, 39.65, 40.8)), 1 - seg(t, 48.4, 49.2));
        setGroupScale(networkGroup, netP);
        networkGroup.rotation.z = 0.025 * Math.sin(t * 0.45);
        networkEdges.forEach((e, i) => {
          const u = (t * 0.22 + e.phase) % 1;
          e.pulse.position.lerpVectors(new THREE.Vector3(0, 0.08, 0), e.p, u < 0.5 ? u * 2 : (1 - u) * 2);
          const s = 1 + 0.18 * Math.sin(t * 2 + i);
          e.node.scale.set(s, s, s);
        });
        const ring = networkGroup.getObjectByName("cycleRing");
        const arrow = networkGroup.getObjectByName("cycleArrow");
        if (ring && arrow) {
          const a = 0.45 + t * 0.32;
          ring.rotation.z = a;
          const endA = a + Math.PI * 1.72;
          arrow.position.set(Math.cos(endA) * 2.45, Math.sin(endA) * 2.45, -0.35);
          arrow.rotation.z = endA - Math.PI / 2;
        }

        const foundP = Math.min(easeOut(seg(t, 48.75, 49.9)), 1 - seg(t, 55.15, 56.0));
        setGroupScale(foundationGroup, foundP);
        columns.forEach((obj, i) => {
          if (obj.geometry && obj.geometry.type === "CylinderGeometry") {
            obj.scale.y = 1.82 * easeOut(seg(t, 49.25 + i * 0.08, 50.3 + i * 0.08));
          }
        });
        foundationGroup.children.forEach((obj) => {
          if (obj.name === "cap") obj.position.y = -2.55 + 1.86 * easeOut(seg(t, 49.35, 50.45));
          if (obj.name === "platform" || obj.name === "platformEdge") {
            const baseY = obj.name === "platform" ? -0.72 : -0.58;
            obj.position.y = baseY - (1 - easeOut(seg(t, 49.8, 50.8))) * 0.28;
          }
        });

        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__hfThreeRender = () => renderAt(window.__hfThreeTime || 0);
      renderAt(0);

      const tl = gsap.timeline({ paused: true });
      tl.to({ v: 0 }, { v: 1, duration: 60, ease: "none" }, 0);
      window.__timelines["stage3d"] = tl;
    })();
  </script>
</template>
