<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Why the Dollar Rules — HyperFrames</title>
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0a0a0f;
        --ink: #ffffff;
        --gold: #d4af37;
        --blue: #4a90d9;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        font-family: Inter, Arial, sans-serif;
      }
      .scene-host {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #stage3d {
        z-index: 0;
      }
      .text-host {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-mcdv"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
      data-motion-blur="off"
    >
      <div data-hf-id="hf-3ppc"
        id="stage3d"
        class="scene-host"
        data-composition-id="stage3d"
        data-composition-src="compositions/stage.html"
        data-start="0"
        data-duration="60"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-5lxm"

        data-track-index="20"
        data-volume="0.5"
        data-fade-in="1.5"
        data-fade-out="2.5"

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

</html>
