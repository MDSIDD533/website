[project]
name = "sidd-ai-video-studio"
version = "1.0.0"
description = "Personal Local-First AI 3D Video Studio"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: End-to-end Blender 3D animation, local TTS, and FFmpeg MP4 decode verification test",
]
