name: SIDD AI Video Studio CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install routine CI dependencies (no multi-GB model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic python-multipart python-dotenv imageio-ffmpeg av bpy==4.2.15 piper-tts onnxruntime "numpy<2.7" scipy Pillow psutil requests pytest pytest-asyncio httpx
      - name: Prepare headless Blender Python module
        run: python scripts/setup_headless_bpy.py
      - name: Run unit, security, offline, license, and API tests
        run: pytest -m "not e2e" -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build TypeScript & React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  optional-e2e-3d-render:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install full stack including headless Blender (bpy)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/setup_headless_bpy.py
      - name: Run end-to-end 3D video export & decode verification
        run: pytest -m "e2e" -v
